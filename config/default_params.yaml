# mosaiQTL Nextflow pipeline parameters
# Maps directly to positional args consumed by workflow/scripts/run_*.py

# ── inputs (required) ───────────────────────────────────────────────────────
gigamuga_csv:   null          # path to GigaMUGA CSV (ref/GM_ccf1fo_mm39.csv); used only if ref/igvf_cache.h5 absent
genomecache:    null          # path to genome cache HDF5 (ref/igvf_cache.h5)
phenotypes:     null          # path to counts HDF5 (counts_lognorm.h5 for single-CT)
gene_info:      null          # path to gene info CSV (ref/gene_info.vm36.csv)
gene_tss:       null          # path to strand-aware transcript TSS CSV (gene_tss.vm36.csv); gives near_tss_mb and cis_dist_mb
metadata:       null          # path to sample metadata CSV (ref/igvf_sample_metadata.csv)
sanger_alleles: null          # path to Sanger alleles HDF5 (ref/sanger_alleles.h5); null = skip FINEMAP SNP step

# ── cell type ────────────────────────────────────────────────────────────────
celltype:       null          # cell type label for output paths
tissue:         ''            # tissue label prepended to output filenames; '' = omit

# ── multi-CT mode ────────────────────────────────────────────────────────────
celltypes_dir:  null          # directory of per-CT subdirs, each with counts_lognorm.h5
celltypes:      'all'         # 'all' or comma-separated: 'glutamatergic_neuron,oligodendrocyte'

# ── scan ─────────────────────────────────────────────────────────────────────
scan_type:      'L'           # L (local ±window_mb) | C (chromosome-wide) | G (genome-wide)
window_mb:      1.0           # half-window in Mb for scan_type L
chroms:         'all'         # 'all' or comma-separated: '1,2,8'
covariates:     'sex,dataset' # comma-separated metadata columns as fixed effects; '' = intercept-only
use_rint:       true          # rank-inverse normal transform before LMM scan; correct for
                              # log-normalised expression only — set false for Gaussian
                              # phenotypes (body weight etc.) or NB-GLMM (future)

# ── permutation + FDR ────────────────────────────────────────────────────────
n_perms:              1000    # genome-wide permutations for GEV threshold
n_perms_cal:          1000    # per-eGene permutations for Beta-calibrated p-values (Storey FDR)
perm_method:          'parametric'   # permutation method passed to run_threshold_scans
fdr_threshold:        0.05    # FDR threshold for eGene calling
submission_fdr:       0.1     # haplotype_peak_lod.tsv keeps tested genes with qval_bh <= this; calibration and q-values use all tested genes
call_rule:            'bh'      # 'bh' (Benjamini-Hochberg), 'qvalue' (Storey) or 'lfdr' (local FDR) over all tested genes; an eGene also needs peak LOD above the permutation threshold
seed:                 42

# ── fine-mapping ─────────────────────────────────────────────────────────────
n_bootstrap:    1000          # bootstrap replicates for CI (run_finemap.py)
gtf:            null          # optional GENCODE GTF path for gene-track locus panels in REPORT

# ── outputs ──────────────────────────────────────────────────────────────────
output_dir:     'results'
