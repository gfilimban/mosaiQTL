# mosaiQTL — gastroc single-cell-type scan parameters
# Run: nextflow run workflow/main.nf -profile slurm -params-file config/gastroc_params.yaml -resume

genomecache:  '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/py_ref/cache.h5'
kinship_loco: null   # null → built once by KINSHIP_LOCO on first run;
                     # after first run set to the published kinship_loco.h5 path for -resume speed

# single-CT mode (no celltypes_dir)
phenotypes:   '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/gastroc_data/counts_lognorm.h5'
celltype:     'gastroc'
gene_info:    '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/gastroc_data/exp_gene_info_gastroc.csv'

output_dir:   '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/gastroc_data/nf_results'
scan_type:    'lmm'
scan_window:  'cis'
chroms:       'all'
n_perms:      1000
window_mb:    1.0
