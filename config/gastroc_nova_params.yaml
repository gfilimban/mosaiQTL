# mosaiQTL — gastroc × nova pipeline (HPC)
# Celltypes run (default):
#   nextflow run workflow/main.nf -profile slurm -params-file config/gastroc_nova_params.yaml -resume
#
# Subtypes run (override two paths):
#   nextflow run workflow/main.nf -profile slurm \
#       -params-file config/gastroc_nova_params.yaml \
#       --celltypes_dir /dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/nova/subtypes \
#       --output_dir    /dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/nova/subtypes \
#       -resume

genomecache:   '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/data/cache.h5'
data_dir:      '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/data'
kinship_loco:  '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/data/kinship_loco.h5'

celltypes_dir: '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/nova/celltypes'
celltypes:     'all'
gene_info:     '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/nova/exp_gene_info_gastroc_universe.csv'

output_dir:    '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/nova/celltypes'
scan_type:     'lmm'
scan_window:   'cis'
chroms:        'all'
n_perms:       1000
window_mb:     1.0
