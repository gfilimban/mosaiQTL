# mosaiQTL — gastroc × next pipeline (HPC)
# Celltypes run (default):
#   nextflow run workflow/main.nf -profile slurm -params-file config/gastroc_next_params.yaml -resume
#
# Subtypes run (override two paths):
#   nextflow run workflow/main.nf -profile slurm \
#       -params-file config/gastroc_next_params.yaml \
#       --celltypes_dir /dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/next/subtypes \
#       --output_dir    /dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/next/subtypes \
#       -resume

genomecache:   '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/data/cache.h5'
data_dir:      '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/data'
kinship_loco:  null   # null → built once by KINSHIP_LOCO on first run;
                      # after first run, set to the published kinship_loco.h5 path for -resume speed

celltypes_dir: '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/next/celltypes'
celltypes:     'all'
gene_info:     '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/next/exp_gene_info_gastroc_universe.csv'

output_dir:    '/dfs9/seyedam-lab/share/igvf_qtl/output/gastroc/next/celltypes'
scan_type:     'lmm'
scan_window:   'cis'
chroms:        'all'
n_perms:       1000
window_mb:     1.0
