# mosaiQTL — ctxhipp multi-cell-type scan parameters (local CRSP)
# Run: nextflow run workflow/main.nf -profile slurm -params-file config/ctxhipp_params.yaml -resume
#
# Each subdirectory of celltypes_dir must contain counts_lognorm.h5.
# gene_info is used as the global fallback; per-CT gene_info.csv is preferred if present.
#
# Subtypes: add --celltypes_dir .../subtypes --output_dir .../subtypes

genomecache:   '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/ref/cache.h5'
data_dir:      '/dfs9/seyedam-lab/share/igvf_qtl/mosaiqtl/ref'

celltypes_dir: '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/ctxhipp_data/celltypes'
gene_info:     '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/ctxhipp_data/exp_gene_info_ctxhipp.csv'
output_dir:    '/share/crsp/lab/seyedam/gfilimba/packages/mosaiqtl/validation/ctxhipp_data/nf_results'
