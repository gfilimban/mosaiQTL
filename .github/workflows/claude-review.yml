name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: Claude Code automated review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Post inline PR comments for findings; fail on FAIL-level issues
          direct_prompt: |
            Review this pull request for:
            1. Correctness bugs — wrong math, off-by-one, shape mismatches
            2. Violations of CLAUDE.md inviolable rules (chr .astype(str), no bare except,
               no shell=True, no hardcoded hex colors, no full LOD matrix materialised,
               adata.raw.X not adata.X, logging not print)
            3. Regressions against the validated R/miQTL port (lmm.py, scan.py,
               permutation.py) — any change to LOD formula, h2 parameterisation,
               or FWL projection warrants extra scrutiny
            4. Memory architecture violations — per-gene HDF5 open inside a loop,
               full genome-wide array allocation
            Report as PASS / WARN / FAIL with file:line references.
            Post findings as inline PR comments.
