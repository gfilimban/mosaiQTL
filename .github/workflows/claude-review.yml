name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    name: Claude Code automated review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CLAUDE.md files are gitignored, so the rules the review needs are stated here.
          prompt: |
            REPO: ${{ github.repository }}  PR: ${{ github.event.pull_request.number }}
            Review only the diff of this pull request (gh pr diff). Report PASS / WARN / FAIL with file:line.
            1. Correctness: wrong math, off-by-one, shape mismatches; any change to the LOD formula,
               h² parameterisation (ML, w = h²·λ + 1 − h²) or FWL projection in lmm.py, scan.py or
               permutation.py needs extra scrutiny against the validated miQTL port.
            2. Statistics: LOCO kinship only; Storey FDR over all tested genes (no LOD pre-selection).
            3. Compute: inputs loaded lazily (only chromosomes, genes and columns used); no genes × loci
               array; gene-invariant work hoisted out of per-gene, per-locus and per-permutation loops;
               no per-gene file open in a loop; no gc.collect() in loops; no Python loop over loci.
            4. Rules: chr stored as 'chr{N}' str before merges; no inline hex (genotype/cc.py,
               viz/_theme.py); no bare except, shell=True or print; adata.raw.X for counts.
            5. Docs: CHANGELOG.md [Unreleased] entry; README, docs/ARCHITECTURE.md or docs/math updated
               when the CLI, data flow or a formula changed.
            Post findings as inline comments and one summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
