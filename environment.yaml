# mosaiQTL conda environment
# Compiled extensions (numpy, scipy, pandas, h5py, matplotlib, seaborn) are resolved
# from conda-forge; pure-Python packages unavailable there are resolved from conda-pypi
# (PyPI via conda). Never use the pip: subsection — it breaks ABI consistency.
#
# Create:   conda env create -f environment.yaml
# Update:   conda env update -f environment.yaml --prune
# Activate: conda activate mosaiqtl

name: mosaiqtl
channels:
  - conda-forge
  - conda-pypi
  - nodefaults
dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.13

  # ── Compiled extensions (conda-forge) ────────────────────────────────────
  - numpy>=2.1,<3
  - scipy>=1.14,<2
  - pandas>=2.2,<3
  - h5py>=3.11,<4
  - matplotlib>=3.9,<4
  - seaborn>=0.13,<1

  # ── R ecosystem ───────────────────────────────────────────────────────────
  - r-base>=4.4
  - rpy2>=3.5

  # ── Graph / clustering ────────────────────────────────────────────────────
  - igraph>=1.0
  - leidenalg>=0.10

  # ── Dev tooling ───────────────────────────────────────────────────────────
  - black
  - flake8
  - mypy
  - pytest
  - pytest-cov
  - pytest-benchmark

  # ── Pure-Python packages (conda-pypi) ────────────────────────────────────
  - anndata>=0.10
  - scanpy>=1.10
  - pydantic>=2.5
  - click>=8.1
  - interrogate>=1.5
  - pandas-stubs
  - scipy-stubs
